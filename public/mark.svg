<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Hussnain Ahmad">
  <title>Hussnain Ahmad</title>
  <!--
    The mark is the elevation ramp itself: three ascending bars in the
